<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <!-- Central Circle with Gradient -->
  <circle cx="256" cy="256" r="180" fill="url(#roseGrad)" filter="url(#glow)" />
  <!-- Play Icon -->
  <polygon points="216,160 216,352 360,256" fill="#ffffff" stroke-linejoin="round" />
</svg>
